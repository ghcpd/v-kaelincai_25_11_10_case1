<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Search with History</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h2>Search with History Dropdown</h2>
    <label>
      <input type="checkbox" id="persist-toggle" checked /> Persist history
    </label>
    <button id="clear-history">Clear History</button>
    <br/>
    <input id="search-input" aria-label="Search" placeholder="Search or type to see history" />
    <div id="history-dropdown" role="listbox" aria-hidden="true"></div>
    <div id="output"></div>
    <script src="search_history.js"></script>
  </body>
  </html>
