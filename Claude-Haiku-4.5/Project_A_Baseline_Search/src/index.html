<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project A - Baseline Search (Enter-Only)</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            background: white;
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #333;
            margin-top: 0;
            border-bottom: 3px solid #007acc;
            padding-bottom: 10px;
        }
        .feature-status {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 4px;
        }
        .search-section {
            margin: 30px 0;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }
        #search_input {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }
        #search_input:focus {
            outline: none;
            border-color: #007acc;
            background: #f9f9f9;
        }
        .info {
            margin-top: 15px;
            padding: 10px;
            background: #fff8e1;
            border-left: 4px solid #ffa500;
            border-radius: 4px;
            font-size: 14px;
            color: #666;
        }
        .results-section {
            margin-top: 30px;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 4px;
        }
        .results-section h3 {
            color: #333;
            margin-top: 0;
        }
        .result-item {
            background: white;
            padding: 10px;
            margin: 8px 0;
            border-left: 4px solid #007acc;
            border-radius: 2px;
        }
        .result-item .label {
            font-weight: 600;
            color: #007acc;
            font-size: 12px;
            text-transform: uppercase;
        }
        .result-item .value {
            color: #333;
            word-break: break-all;
        }
        .timestamp {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }
        code {
            background: #f0f0f0;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: "Courier New", monospace;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Project A: Baseline Search (Pre-Feature)</h1>
        <div class="feature-status">
            <strong>Feature Status:</strong> Enter-Only Search (No History Dropdown)
        </div>

        <div class="search-section">
            <label for="search_input">Search (Press Enter to submit):</label>
            <input 
                id="search_input" 
                type="text" 
                placeholder="Type your search query and press Enter..."
                aria-label="Search input field"
                aria-describedby="search-help"
            >
            <div class="info" id="search-help">
                💡 <strong>Usage:</strong> Type your search query and press <code>Enter</code> to submit. 
                No search history dropdown in this baseline version.
            </div>
        </div>

        <div class="results-section">
            <h3>Search Results</h3>
            <div id="results">
                <p style="color: #999;">No searches performed yet.</p>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
